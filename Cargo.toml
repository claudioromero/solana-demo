[package]
name = "solana-demo"
version = "0.1.0"
description = "A minimal native Solana program"
edition = "2021"
license = "MIT"

[dependencies]
borsh = "1.5"
solana-program = "2.0"
spl-token = { version = "6.0", features = ["no-entrypoint"] }

[dev-dependencies]
assert_matches = "1.5"

[lib]
name = "solana_demo"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"